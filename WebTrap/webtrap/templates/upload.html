<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>{{ title }}</title>
<style>body{font-family:-apple-system,Segoe UI,sans-serif;background:#f6f7f7;margin:0;padding:40px}
.box{background:#fff;border:1px solid #c3c4c7;padding:24px;max-width:520px;margin:0 auto}
input[type=file]{margin:12px 0}
button{background:#2271b1;color:#fff;border:0;padding:10px 18px;border-radius:4px;cursor:pointer}</style></head>
<body><div class="box"><h1>Document Upload</h1>
<p>Authorized personnel only. Maximum file size 16 MB.</p>
<form method="post" enctype="multipart/form-data" action="">
<input type="file" name="file" required>
<br><button type="submit">Upload</button>
</form></div></body></html>
