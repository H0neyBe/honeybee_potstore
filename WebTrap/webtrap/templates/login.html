<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f0f1;margin:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#fff;padding:30px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1);width:340px}
h1{font-size:22px;margin:0 0 18px;text-align:center;color:#1d2327}
input[type=text],input[type=password],input[type=email]{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:4px;box-sizing:border-box;font-size:14px}
input[type=submit]{width:100%;padding:11px;background:#2271b1;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px}
input[type=submit]:hover{background:#135e96}
.error{background:#fff;border-left:4px solid #dc3232;padding:12px;margin:0 0 18px;color:#1d2327;font-size:13px}
label{display:block;margin-top:8px;font-size:13px;color:#1d2327}
.foot{margin-top:18px;text-align:center;font-size:12px;color:#646970}
.foot a{color:#2271b1;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h1>{{ title }}</h1>
{% if error %}<div class="error"><strong>ERROR:</strong> {{ error }}</div>{% endif %}
<form method="post" action="{{ action_path }}" autocomplete="off">
<label for="log">Username or Email</label>
<input type="text" name="log" id="log" required>
<label for="pwd">Password</label>
<input type="password" name="pwd" id="pwd" required>
<input type="hidden" name="username" id="username">
<input type="hidden" name="password" id="password">
<input type="submit" value="Sign In">
</form>
<div class="foot"><a href="/admin/forgot">Lost your password?</a> &middot; <a href="/">Home</a></div>
</div>
</body>
</html>
